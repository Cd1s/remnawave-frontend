name: Sync upstream

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: upstream-sync-frontend
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: singbox
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Resolve official latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: remnawave/frontend
          UPSTREAM_SYNC_REPORT_PATH: ${{ runner.temp }}/upstream-sync-report.md
        run: bash .github/scripts/upstream-sync-lib.sh resolve
      - name: Detect and merge upstream
        id: sync
        env:
          UPSTREAM_REF: ${{ steps.release.outputs.commit }}
          UPSTREAM_SYNC_REPORT_PATH: ${{ runner.temp }}/upstream-sync-report.md
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/remnawave/frontend.git
          git fetch --no-tags upstream main
          git fetch --no-tags upstream "refs/tags/${{ steps.release.outputs.tag }}:refs/tags/upstream-release-${{ steps.release.outputs.tag }}"
          bash .github/scripts/upstream-sync-lib.sh merge
      - uses: actions/setup-node@v4
        if: steps.sync.outcome == 'success'
        with:
          node-version: 24
          cache: npm
      - name: Verify package version from official release commit
        if: steps.sync.outcome == 'success'
        env:
          UPSTREAM_REF: ${{ steps.release.outputs.commit }}
          PACKAGE_PATHS: package.json
          UPSTREAM_SYNC_REPORT_PATH: ${{ runner.temp }}/upstream-sync-report.md
        run: bash .github/scripts/upstream-sync-lib.sh package
      - run: npm ci --no-audit --no-fund
        if: steps.sync.outcome == 'success'
      - run: npm run typecheck
        if: steps.sync.outcome == 'success'
      - run: npm run check
        if: steps.sync.outcome == 'success'
      - run: npm run start:build
        if: steps.sync.outcome == 'success'
      - name: Verify write capabilities before push
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPSTREAM_SYNC_REPORT_PATH: ${{ runner.temp }}/upstream-sync-report.md
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$WORKFLOW_TOKEN" | base64 | tr -d '\\n')"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
          bash .github/scripts/upstream-sync-lib.sh preflight
      - name: Configure ephemeral GitHub auth for push
        if: steps.sync.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          token="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          {
            echo 'GIT_CONFIG_COUNT=1'
            echo 'GIT_CONFIG_KEY_0=http.https://github.com/.extraheader'
            echo "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic $token"
          } >> "$GITHUB_ENV"
      - name: Resolve final fork commit
        id: source
        if: steps.sync.outcome == 'success'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Push tested merge
        if: steps.sync.outcome == 'success'
        env:
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WORKFLOW_TOKEN"
          auth_header="$(printf 'x-access-token:%s' "$WORKFLOW_TOKEN" | base64 | tr -d '\\n')"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
          git push origin HEAD:singbox
      - name: Verify pushed final commit
        if: steps.sync.outcome == 'success'
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          remote_sha="$(git ls-remote origin refs/heads/singbox | awk 'NR == 1 { print $1 }')"
          test "$remote_sha" = "$EXPECTED_SHA" || { echo "release_sync=failed reason=remote_branch_not_at_final_commit expected=$EXPECTED_SHA actual=${remote_sha:-missing}" >&2; exit 1; }
      - name: Sync official fork Release
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_REPO: ${{ github.repository }}
          FORK_COMMIT: ${{ steps.source.outputs.sha }}
          UPSTREAM_REPO: remnawave/frontend
          UPSTREAM_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          UPSTREAM_RELEASE_URL: ${{ steps.release.outputs.url }}
          UPSTREAM_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/sync-release.sh sync
      - name: Upload auditable upstream failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-report-${{ github.run_id }}
          path: ${{ runner.temp }}/upstream-sync-report.md
          if-no-files-found: warn
